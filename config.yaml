networks: ["flexoffers"]

sync:
  page: 1
  page_size: 100
  selectable_fields: "all"
  target_status: "Draft"   # only persist shops whose status badge contains this; "" = any
  max_pages: 80            # cap on Partner Shop list pages walked per network

runner:
  max_shops_per_batch: 50
  max_concurrency: 6
  inter_shop_jitter_ms: [500, 2000]

harvest:
  networkidle_timeout_seconds: 15
  consent_wait_ms: 2000
  review_threshold: 0.0

writeback:
  verify_after_save: true

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  max_retries: 3
  timeout_seconds: 30

logging:
  level: "INFO"
  debug_log_retention_days: 7
